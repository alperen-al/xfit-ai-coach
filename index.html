<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XFIT Karabük - AI Fitness & Diyet Koçu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .output-box table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .output-box th {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 700;
            text-align: left;
            padding: 10px 12px;
            font-size: 0.85rem;
        }
        .output-box td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            font-size: 0.875rem;
        }
        .output-box tr:nth-child(even) {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Başlık & XFIT Marka Alanı -->
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-blue-600 tracking-tight">XFIT <span class="text-slate-900">PLATINUM</span></h1>
            <p class="text-blue-500 font-semibold text-sm mt-1">AI Fitness & Diyet Asistanı Prototipi</p>
        </div>

        <!-- Form Kutusu -->
        <div class="max-w-2xl mx-auto mt-6 bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <form id="fitnessForm" class="space-y-6">
                
                <!-- BÖLÜM 1: Temel Ölçüler -->
                <div class="border-b border-slate-200 pb-4">
                    <h2 class="text-lg font-bold text-blue-600 mb-3">1. Temel Profil & Vücut Ölçüleri</h2>
                    
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Ad Soyad</label>
                            <input type="text" id="name" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Ahmet Yılmaz">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Yaş</label>
                            <input type="number" id="age" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="25">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Cinsiyet</label>
                            <select id="gender" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500">
                                <option value="Erkek">Erkek</option>
                                <option value="Kadın">Kadın</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Boy (cm)</label>
                            <input type="number" id="height" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="180">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kilo (kg)</label>
                            <input type="number" id="weight" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="80">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Bel Çevresi (cm)</label>
                            <input type="number" id="waist" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="85">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Boyun Çevresi (cm)</label>
                            <input type="number" id="neck" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="38">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Omuz Ölçüsü (cm)</label>
                            <input type="number" id="shoulder" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="115">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Göğüs Ölçüsü (cm)</label>
                            <input type="number" id="chest" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="100">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Sağ Biceps (cm)</label>
                            <input type="number" id="bicepsRight" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="36">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Sol Biceps (cm)</label>
                            <input type="number" id="bicepsLeft" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="35.5">
                        </div>
                    </div>
                </div>

                <!-- BÖLÜM 2: Meslek & Aktivite -->
                <div class="border-b border-slate-200 pb-4">
                    <h2 class="text-lg font-bold text-blue-600 mb-3">2. Meslek & Günlük Aktivite</h2>
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Meslek / Gün İçi Aktivite (Zorunlu)</label>
                        <input type="text" id="job" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Öğrenci, Masa Başı Yazılımcı...">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Harici Yapılan Spor Branşı</label>
                            <input type="text" id="otherSports" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Boks (Yoksa boş)">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Harici Spor Kaç Gün?</label>
                            <select id="otherSportsDays" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500">
                                <option value="Yok">Spor Yapmıyorum</option>
                                <option value="Haftada 1 Gün">Haftada 1 Gün</option>
                                <option value="Haftada 2 Gün">Haftada 2 Gün</option>
                                <option value="Haftada 3 Gün">Haftada 3 Gün</option>
                                <option value="Haftada 4+ Gün">Haftada 4+ Gün</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- BÖLÜM 3: Fitness Tercihleri -->
                <div class="border-b border-slate-200 pb-4">
                    <h2 class="text-lg font-bold text-blue-600 mb-3">3. Fitness Tercihleri & Kısıtlamalar</h2>
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Ana Hedef</label>
                            <select id="goal" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500">
                                <option value="Kilo Almak / Hacimlenme (Bulk)">Kilo Almak (Bulk)</option>
                                <option value="Yağ Yakımı ve Kilo Vermek (Cut)">Yağ Yakımı (Cut)</option>
                                <option value="Kas Kütlesi Koruyarak Sıkılaşma">Sıkılaşma & Kas Yapımı</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Spora Gidilecek Gün</label>
                            <select id="days" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500">
                                <option value="Haftada 3 Gün">Haftada 3 Gün</option>
                                <option value="Haftada 4 Gün">Haftada 4 Gün</option>
                                <option value="Haftada 5 Gün">Haftada 5 Gün</option>
                                <option value="Haftada 6 Gün" selected>Haftada 6 Gün</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Antrenman Şiddeti</label>
                            <select id="intensity" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500">
                                <option value="Hafif / Başlangıç">Hafif</option>
                                <option value="Orta / Standart">Orta</option>
                                <option value="Yüksek (Hardcore)" selected>Yüksek (Hardcore)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Sakatlık / Medikal Kısıtlama</label>
                            <input type="text" id="injuries" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Bel fıtığı...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Yapmak İstemediğiniz Hareketler</label>
                            <input type="text" id="dislikedExercises" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Deadlift...">
                        </div>
                    </div>
                </div>

                <!-- BÖLÜM 4: Beslenme Profili -->
                <div>
                    <h2 class="text-lg font-bold text-blue-600 mb-3">4. Beslenme & Alerji Tercihleri</h2>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Alerjiler veya Hassasiyetler</label>
                            <input type="text" id="allergies" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Gluten...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tüketilmeyen Besinler</label>
                            <input type="text" id="dislikedFoods" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Brokoli...">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Öncelikli / Sevilen Besinler</label>
                        <input type="text" id="likedFoods" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm text-slate-900 focus:outline-none focus:border-blue-500" placeholder="Örn: Tavuk göğsü...">
                    </div>
                </div>

                <!-- Akıllı Uyarı Kutusu -->
                <div id="warningBox" class="hidden bg-amber-50 border-l-4 border-amber-500 text-amber-900 p-4 rounded-r-lg text-sm shadow-sm">
                    <p class="font-bold flex items-center gap-1 text-amber-700">⚠️ Akıllı Sağlık Uyarısı:</p>
                    <p id="warningText" class="mt-1 text-slate-700"></p>
                    <button type="button" id="forceSubmitBtn" class="mt-3 bg-amber-500 hover:bg-amber-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">Yine de Bu Hedefle Devam Et</button>
                </div>

                <!-- İKİYE BÖLÜNMÜŞ BUTONLAR -->
                <div class="w-full mt-8 flex justify-center">
                    <button id="generateAllBtn" type="button" style="width: 100%; border: none; cursor: pointer;" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition duration-200 ease-in-out text-center block text-base sm:text-lg">
                        🚀 Kişisel XFIT Raporumu Oluştur (Diyet + Antrenman)
                    </button>
                </div>
            </form>
        </div>

        <!-- Yükleniyor Kutusu -->
        <div id="loading" class="hidden max-w-xl mx-auto mt-8 text-center text-blue-600 font-bold animate-pulse bg-white p-6 rounded-2xl shadow-sm border border-blue-100">
            ⏳ XFIT AI: İstenen program özel olarak analiz ediliyor...
        </div>

        <!-- Sonuç Kutusu -->
        <div id="resultCard" class="hidden max-w-4xl mx-auto mt-8 bg-white p-8 rounded-2xl shadow-xl border border-blue-100 output-box">
            <div id="outputContent"></div>
        </div>
    </div>

    <!-- TEK VE DÜZGÜN ÇALIŞAN JS BAĞLANTISI -->
    <script src="app.js"></script>
</body>
</html>
